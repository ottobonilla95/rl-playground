[project]
name = "rl-playground"
version = "0.1.0"
description = "A modular library of playable Gymnasium environments and educational RL examples."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["gymnasium>=1.2,<2", "numpy>=2,<3", "pygame>=2.6,<3"]

[project.optional-dependencies]
train = ["torch>=2.8,<3", "matplotlib>=3.10,<4"]

[project.scripts]
basketball-play = "rl_playground.envs.basketball.play:main"
basketball-train = "rl_playground.envs.basketball.train:main"
basketball-evaluate = "rl_playground.envs.basketball.evaluate:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rl_playground"]
